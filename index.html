<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barnacle Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <form id="search-form">
      <input id="search-input" type="search" placeholder="Search a place" autocomplete="off" aria-label="Search a place">
      <button type="submit">Go</button>
    </form>
    <div id="mode" role="radiogroup" aria-label="Travel mode">
      <label><input type="radio" name="mode" value="foot" checked> Walk</label>
      <label><input type="radio" name="mode" value="car"> Car</label>
    </div>
    <ul id="results"></ul>
    <div id="stops-box" hidden>
      <ol id="stops" aria-label="Stops"></ol>
      <button type="button" id="clear-stops">Clear stops</button>
    </div>
    <ul id="routes" aria-label="Route options"></ul>
    <p id="status" role="status"></p>
    <div id="phone" hidden>
      <strong>Continue on your phone</strong>
      <span>Scan with your phone camera.</span>
      <img id="phone-qr" width="245" height="245" alt="QR code to open this route on your phone">
      <code id="phone-url"></code>
      <a id="phone-link" target="_blank" rel="noopener">Open on your phone ↗</a>
      <span id="phone-stops" hidden>Stops are not included in the phone link.</span>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/qrcode-generator@2.0.4/dist/qrcode.js" integrity="sha384-e9EFD6BGC90bkW9aDV5xbbBfzwN7G8YImHao2lfLVKV/hPB0E0go+H3I64h7oHtA" crossorigin="anonymous"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
