<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barnacle Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <form id="search-form">
      <input id="search-input" type="search" placeholder="Search a place" autocomplete="off" aria-label="Search a place">
      <button type="submit">Go</button>
    </form>
    <div id="mode" role="radiogroup" aria-label="Travel mode">
      <label><input type="radio" name="mode" value="foot" checked> Walk</label>
      <label><input type="radio" name="mode" value="car"> Car</label>
    </div>
    <ul id="results"></ul>
    <ul id="routes" aria-label="Route options"></ul>
    <p id="status" role="status"></p>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
