<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barnacle Maps · Summary card designs</title><style>
:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#1f1f1f;--muted:#555;--frame:#d0d4da}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8eaed;--muted:#a8adb5;--frame:#3a3f47}
 .map{filter:brightness(.82)}}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}p.lead{margin:0 0 20px;color:var(--muted);font-size:14px}
.grid{display:flex;flex-wrap:wrap;gap:24px}
figure{margin:0;width:420px}figcaption{margin-top:8px;font-size:14px;color:var(--muted)}figcaption b{color:var(--fg)}
.map{position:relative;width:420px;height:420px;overflow:hidden;border:1px solid var(--frame);border-radius:8px;font-size:12px;color:#1f1f1f}
.tiles{position:absolute;inset:0;width:100%;height:100%}
.panel{position:absolute;top:10px;left:10px;width:210px;background:#fff;border-radius:8px;padding:7px;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:2}
.sf{display:flex;gap:4px}.in{flex:1;border:1px solid #767676;padding:4px;font-size:12px}.go{border:1px solid #767676;background:#efefef;padding:3px 7px;border-radius:2px}
.mode{display:flex;gap:10px;margin-top:5px;font-size:11px}
.routes{list-style:none;margin:5px 0 0;padding:0}.routes li{padding:4px 6px;border-left:3px solid transparent;font-size:11.5px}
.routes li.sel{border-left-color:#1a73e8;background:#e8f0fe}.routes small{display:block;font-size:10px;color:#666;margin-top:1px}
.routes small.best{color:#188038;font-weight:600}.st{margin:5px 0 0;font-size:11px}
.attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);font-size:9px;padding:1px 5px;z-index:2}
.cardA{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;display:flex;gap:12px;align-items:baseline;background:#fff;border-radius:8px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:13px;white-space:nowrap;z-index:2}
.cardA b{color:#1a73e8;font-size:15px}.cardA span+span{border-left:1px solid #ddd;padding-left:12px}
.cardB{position:absolute;top:10px;right:10px;background:#fff;border-radius:8px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3);border-left:3px solid #1a73e8;font-size:12px;line-height:1.45;z-index:2}
.cardB .t{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.04em}.cardB .big{font-size:18px;font-weight:600;color:#1a73e8}
.cardC{position:absolute;left:200px;top:212px;background:#1a73e8;color:#fff;border-radius:6px;padding:4px 8px;font-size:11.5px;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.35);z-index:2}
.cardC:after{content:"";position:absolute;left:18px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#1a73e8}
@media (prefers-color-scheme:dark){.panel,.cardA,.cardB,.attr{filter:none}}
</style></head><body>
