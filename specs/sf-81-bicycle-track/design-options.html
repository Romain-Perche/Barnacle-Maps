<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barnacle Maps — Bike travel mode: design options</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f5f7; --ink: #202124; --muted: #666; --panel: #fff; --line: #dadce0;
    --blue: #1a73e8; --sel: #e8f0fe; --green: #188038; --input: #fff;
    --map: #e9e5dc; --park: #c8e6c0; --road: #fff; --water: #aad3df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #17181a; --ink: #e8eaed; --muted: #a0a4a8; --panel: #2a2b2e; --line: #4a4c50;
      --blue: #8ab4f8; --sel: #2c3a52; --green: #81c995; --input: #1f2023;
      --map: #3a3833; --park: #3d5238; --road: #5a5853; --water: #2d4a55;
    }
  }
  body { margin: 0; padding: 24px; background: var(--page); color: var(--ink); font-family: system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .intro { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 24px; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-size: 14px; }
  figcaption b { font-size: 16px; }
  /* fake map */
  .screen { position: relative; height: 430px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    background:
      linear-gradient(90deg, transparent 47%, var(--road) 47%, var(--road) 50%, transparent 50%),
      linear-gradient(0deg, transparent 62%, var(--road) 62%, var(--road) 65%, transparent 65%),
      linear-gradient(25deg, transparent 30%, var(--road) 30%, var(--road) 32%, transparent 32%),
      var(--map); }
  .park { position: absolute; right: 18px; bottom: 30px; width: 120px; height: 90px; background: var(--park); border-radius: 18px; }
  .water { position: absolute; right: 0; top: 0; width: 70px; height: 130px; background: var(--water); border-bottom-left-radius: 50px; }
  .route { position: absolute; height: 6px; border-radius: 3px; transform-origin: left center; }
  .route.alt { background: #888; opacity: .7; height: 5px; }
  .route.sel { background: var(--blue); }
  .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; }
  .pin { position: absolute; width: 16px; height: 16px; background: #2a81cb; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; }
  /* app panel, copied from styles.css */
  .panel { position: absolute; top: 12px; left: 12px; width: 300px; background: var(--panel); border-radius: 8px; padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 16px; }
  .search { display: flex; gap: 6px; }
  .search .in { flex: 1; padding: 8px; font-size: 16px; border: 1px solid var(--line); background: var(--input); border-radius: 2px; }
  .btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--page); font-size: 14px; display: flex; align-items: center; }
  .routes { list-style: none; margin: 6px 0 0; padding: 0; }
  .routes li { padding: 6px 8px; border-left: 3px solid transparent; font-size: 15px; }
  .routes li.selected { border-left-color: var(--blue); background: var(--sel); }
  .pleasure { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pleasure.best { color: var(--green); font-weight: 600; }
  .status { margin: 6px 0 0; font-size: 14px; }
  /* A: radio row */
  .modeA { display: flex; gap: 12px; margin: 6px 0 0; font-size: 14px; align-items: center; }
  .radio { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); vertical-align: -2px; margin-right: 4px; box-sizing: border-box; }
  .radio.on { border: 4px solid var(--blue); }
  /* B: segmented buttons */
  .modeB { display: flex; margin: 8px 0 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 14px; }
  .modeB span { flex: 1; text-align: center; padding: 6px 0; border-left: 1px solid var(--line); }
  .modeB span:first-child { border-left: 0; }
  .modeB span.on { background: var(--sel); color: var(--blue); font-weight: 600; }
  /* C: dropdown */
  .modeC { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 14px; }
  .select { flex: 1; display: flex; justify-content: space-between; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); }
  .note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<h1>Bike travel mode — which design?</h1>
<p class="intro">Each mock shows the Barnacle Maps panel with Bike selected and 3 cycling routes. Only the travel mode selector differs.</p>
<div class="grid">

<figure>
  <div class="screen">
    <div class="water"></div><div class="park"></div>
    <div class="route alt" style="left:70px;top:330px;width:250px;transform:rotate(-28deg)"></div>
    <div class="route alt" style="left:70px;top:330px;width:230px;transform:rotate(-18deg)"></div>
    <div class="route sel" style="left:70px;top:330px;width:240px;transform:rotate(-23deg)"></div>
    <div class="dot" style="left:62px;top:322px"></div><div class="pin" style="left:286px;top:222px"></div>
    <div class="panel">
      <div class="search"><span class="in">Parc de la Tête d'Or</span><span class="btn">Go</span></div>
      <div class="modeA"><span><i class="radio"></i>Walk</span><span><i class="radio"></i>Car</span><span><i class="radio on"></i>Bike</span></div>
      <ul class="routes">
        <li class="selected">Route 1 · 3.4 km · 13 min<span class="pleasure best">Pleasure: 1840 green px · most pleasant</span></li>
        <li>Route 2 · 3.7 km · 14 min<span class="pleasure">Pleasure: 920 green px</span></li>
        <li>Route 3 · 3.9 km · 15 min<span class="pleasure">Pleasure: 610 green px</span></li>
      </ul>
      <p class="status">3 cycling routes · fastest 3.4 km · 13 min</p>
    </div>
  </div>
  <figcaption><b>A — Third radio button</b><br>Good for: smallest change; the selector looks exactly as today.</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="water"></div><div class="park"></div>
    <div class="route alt" style="left:70px;top:330px;width:250px;transform:rotate(-28deg)"></div>
    <div class="route alt" style="left:70px;top:330px;width:230px;transform:rotate(-18deg)"></div>
    <div class="route sel" style="left:70px;top:330px;width:240px;transform:rotate(-23deg)"></div>
    <div class="dot" style="left:62px;top:322px"></div><div class="pin" style="left:286px;top:222px"></div>
    <div class="panel">
      <div class="search"><span class="in">Parc de la Tête d'Or</span><span class="btn">Go</span></div>
      <div class="modeB"><span>🚶 Walk</span><span>🚗 Car</span><span class="on">🚲 Bike</span></div>
      <ul class="routes">
        <li class="selected">Route 1 · 3.4 km · 13 min<span class="pleasure best">Pleasure: 1840 green px · most pleasant</span></li>
        <li>Route 2 · 3.7 km · 14 min<span class="pleasure">Pleasure: 920 green px</span></li>
        <li>Route 3 · 3.9 km · 15 min<span class="pleasure">Pleasure: 610 green px</span></li>
      </ul>
      <p class="status">3 cycling routes · fastest 3.4 km · 13 min</p>
    </div>
  </div>
  <figcaption><b>B — Segmented buttons with icons</b><br>Good for: large tap targets on phones; the mode is easy to see at a glance.</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="water"></div><div class="park"></div>
    <div class="route alt" style="left:70px;top:330px;width:250px;transform:rotate(-28deg)"></div>
    <div class="route alt" style="left:70px;top:330px;width:230px;transform:rotate(-18deg)"></div>
    <div class="route sel" style="left:70px;top:330px;width:240px;transform:rotate(-23deg)"></div>
    <div class="dot" style="left:62px;top:322px"></div><div class="pin" style="left:286px;top:222px"></div>
    <div class="panel">
      <div class="search"><span class="in">Parc de la Tête d'Or</span><span class="btn">Go</span></div>
      <div class="modeC"><span>Travel mode</span><span class="select"><span>Bike</span><span>▾</span></span></div>
      <ul class="routes">
        <li class="selected">Route 1 · 3.4 km · 13 min<span class="pleasure best">Pleasure: 1840 green px · most pleasant</span></li>
        <li>Route 2 · 3.7 km · 14 min<span class="pleasure">Pleasure: 920 green px</span></li>
        <li>Route 3 · 3.9 km · 15 min<span class="pleasure">Pleasure: 610 green px</span></li>
      </ul>
      <p class="status">3 cycling routes · fastest 3.4 km · 13 min</p>
    </div>
  </div>
  <figcaption><b>C — Dropdown list</b><br>Good for: stays compact if more modes come later; one extra tap to change mode.</figcaption>
</figure>

</div>
</body>
</html>
